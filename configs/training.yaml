# =============================================================================
# Training configuration — supervised micro-Doppler autoencoder (iot_radar.ml)
# =============================================================================
# Every model / training / data hyper-parameter is defined here; none of these
# numbers is hard-coded in the Python code.  Relative paths are relative to
# the repository root.

# ---------------------------------------------------------------------------
# Reproducibility
# ---------------------------------------------------------------------------
seed: 42

# auto = CUDA if available, otherwise CPU.  Force with "cpu" or "cuda".
device: auto


# ---------------------------------------------------------------------------
# Data (legacy .npz spectrogram recordings)
# ---------------------------------------------------------------------------
data:
  data_root: data/ml
  train_subdir: train
  val_subdir: val            # used if it contains at least one .npz
  val_split: 0.2             # otherwise: random split of train_subdir

  # CalibrationDataset
  n_cols: 32                 # number of STFT columns per window
  stride: 32                 # step between successive windows (= n_cols -> disjoint)
  normalise: true            # zero mean / unit variance per window


# ---------------------------------------------------------------------------
# DataLoader
# ---------------------------------------------------------------------------
dataloader:
  batch_size: 8
  num_workers: 0             # 0 = load in the main process
  pin_memory: false          # set to true on GPU


# ---------------------------------------------------------------------------
# Model (Conv2D autoencoder + binary classification head)
# ---------------------------------------------------------------------------
model:
  # Expected input shape (C, H, W) — H = n_fft, W = n_cols.
  # Must match what the dataset produces.
  expected_input_shape: [1, 8192, 32]

  # Successive channels: [in, after in_conv, after down_1, ..., latent].
  encoder_channels: [1, 16, 32, 64, 128, 128]

  # (frequency, time) downsampling factors, applied in sequence.  Their
  # cumulative product must divide H and W of expected_input_shape exactly.
  # Here: 4x4x4x4 = 256 on frequency, 2x2x2x2 = 16 on time.
  # Latent: (128, 8192/256, 32/16) = (128, 32, 2).
  downsample_factors: [[4, 2], [4, 2], [4, 2], [4, 2]]

  # Convolution kernels.
  in_conv_kernel:   [7, 3]   # first layer (wide frequency receptive field)
  refine_kernel:    [3, 3]   # after each down / up block
  out_conv_kernel:  [7, 3]   # last decoder layer

  # Classification head (MLP on the globally pooled latent).
  classifier:
    hidden: 64
    dropout: 0.3


# ---------------------------------------------------------------------------
# Training
# ---------------------------------------------------------------------------
training:
  epochs: 50

  # Composite loss: alpha * reconstruction + (1 - alpha) * BCE.
  loss:
    reconstruction: mse      # "mse" or "l1"
    alpha: 0.5               # reconstruction weight (0..1); (1 - alpha) -> BCE
    bce_pos_weight: null     # null = no weighting; otherwise a float

  optimizer:
    name: adamw
    learning_rate: 1.0e-3
    weight_decay: 1.0e-4
    betas: [0.9, 0.999]

  scheduler:
    name: steplr
    step_size: 15            # divide the learning rate by gamma every step_size epochs
    gamma: 0.5

  # Best-checkpoint criterion: "val_total" (default), "val_bce" or "val_recon".
  best_metric: val_total

  # Progress bar (train batches) + validation summary every N epochs.
  # Validation itself runs at every epoch.
  progress_interval: 10


# ---------------------------------------------------------------------------
# Outputs
# ---------------------------------------------------------------------------
output:
  results_dir: results
  checkpoint_name: best.pt
  log_file: results/train.log

  # Per-epoch metrics history (CSV) for plotting in notebooks/inference.ipynb.
  save_metrics: true
  metrics_file: results/history.csv
