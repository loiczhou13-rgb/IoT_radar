# =============================================================================
# Radar configuration — CW radar for detecting the breathing of buried people
# =============================================================================
#
# Single settings file of the streaming pipeline.  Every parameter comes with
# a comment explaining its physical or algorithmic effect.
#
# Units are given by the key suffix: _hz (Hz), _s (seconds), _m / _mm
# (metres / millimetres), _db / _dbm / _dbi (decibels), _m2 (square metres).
# =============================================================================


# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging:
  # Global log level: DEBUG, INFO, WARNING.
  # DEBUG prints every STFT column and every pipeline step.
  level: "INFO"

  # Also write the logs to logs/radar_<timestamp>.log (in addition to the
  # console).  Set to false to disable.  The command-line option --log-file
  # chooses another file.
  to_file: true


# ---------------------------------------------------------------------------
# PlutoSDR transceiver (AD9363)
# ---------------------------------------------------------------------------
sdr:
  # Network or USB address of the PlutoSDR.
  # Network: "ip:192.168.2.1" (Pluto default).
  # USB:     "usb:" (automatic detection).
  uri: "ip:192.168.2.1"

  # Carrier (local-oscillator) frequency (Hz).  lambda = c / f_c = 8.57 cm at
  # 3.5 GHz.  Sets the sensitivity to a chest displacement D: dphi = 4 pi D / lambda.
  center_frequency_hz: 3.5e+9

  # ADC sampling rate (Hz).  Pluto hardware minimum: about 521 kHz.
  # A high rate eases the anti-aliasing filtering before decimation.
  sample_rate_hz: 2.0e+6

  # Receiver gain (dB, manual mode — AGC disabled).
  # Aim at 50–80 % of the 12-bit ADC full scale (±2048), i.e. about ±1024–1638.
  rx_gain_db: 45

  # Transmitter attenuation (dB, negative value).
  # Lower it (more negative) if the TX->RX leakage saturates the receiver.
  tx_gain_db: -20

  # Number of IQ samples per buffer.  2^14 = 16384 -> 8.2 ms per buffer at
  # 2 MS/s.
  buffer_size: 16384


# ---------------------------------------------------------------------------
# Transmitted signal
# ---------------------------------------------------------------------------
tx:
  # Waveform:
  #   "cw"        — pure continuous wave (constant baseband sample, RF at f_c).
  #   "cw_offset" — complex tone at offset_hz in baseband (RF at f_c + offset),
  #                 which moves the useful signal away from the receiver DC
  #                 offset and its 1/f noise.
  #
  # Note: the TX buffer is scaled to ±2^14 (pyadi-iio convention).
  waveform: "cw_offset"

  # Baseband frequency of the TX tone (Hz), "cw_offset" only.  The useful
  # signal appears around offset_hz ± f_breathing in the RX spectrum.
  # The code snaps it to a multiple of sample_rate_hz / buffer_size
  # (122.07 Hz here) so that the cyclic TX buffer holds a whole number of
  # periods: 500 Hz requested -> 488.28 Hz transmitted and used by the receiver.
  offset_hz: 500


# ---------------------------------------------------------------------------
# Decimation (sample-rate reduction)
# ---------------------------------------------------------------------------
decimation:
  # Enable / disable the decimation.
  enabled: true

  # Decimation factor D: output rate = sample_rate_hz / D.
  # With 2 MS/s and D = 1000 -> 2 kHz.  D must factor into primes <= 13.
  factor: 1000

  # Highest useful frequency (Hz), used by the Shannon check:
  # output rate > 2.5 x max(max_useful_frequency_hz, |offset_hz| + reference band top).
  # In cw_offset mode the code widens it automatically.
  max_useful_frequency_hz: 10


# ---------------------------------------------------------------------------
# Clutter suppression (static component / 0 Hz)
# ---------------------------------------------------------------------------
clutter:
  # Clutter-removal method:
  #   "mean"        — subtraction of a running EMA mean (Python loop).
  #   "iir"         — vectorised EMA high-pass IIR filter.
  #   "butterworth" — Butterworth high-pass, configurable order and cut-off.
  #   "mti"         — DEPRECATED (attenuates the breathing frequencies).
  mode: "butterworth"

  # EMA memory factor ("iir" and "mean" modes).  Close to 1 -> long memory,
  # low cut-off.  Approximate cut-off: (1 - alpha) * f_s / (2 pi).
  alpha: 0.9999

  # Order of the Butterworth high-pass ("butterworth" mode only).
  butterworth_order: 2

  # Cut-off of the Butterworth high-pass (Hz).
  # Must stay well below the breathing frequencies (0.1 Hz).
  butterworth_cutoff_hz: 0.05


# ---------------------------------------------------------------------------
# Spectrogram (STFT computed column by column while streaming)
# ---------------------------------------------------------------------------
spectrogram:
  # Window applied to each STFT segment before the FFT:
  #   "hann"     — good resolution / leakage trade-off (-31 dB sidelobes).
  #   "hamming"  — lower sidelobes (-43 dB), wider main lobe.
  #   "blackman" — very low sidelobes (-58 dB).
  #   "flattop"  — best amplitude accuracy, very wide main lobe.
  #   "none"     — rectangular window (best resolution, most leakage).
  window: "hann"

  # FFT size (number of frequency points).  Resolution = f_s_dec / n_fft:
  # with f_s_dec = 2 kHz and n_fft = 8192 -> 0.24 Hz.  One STFT column covers
  # n_fft / f_s_dec = 4.1 s of signal.
  n_fft: 8192

  # Overlap between successive STFT segments (ratio, 0 to < 1).
  # 0.90 -> hop of int(8192 x 0.1) = 819 samples (0.41 s): smooth in time but
  # 10x more FFTs.
  overlap: 0.90

  # Number of STFT columns dropped at start-up (clutter-filter warm-up).
  # null = computed automatically from the clutter mode and f_s_dec / hop:
  # about 3 x tau_filter / T_hop, i.e. 24 columns for a 0.05 Hz order-2
  # Butterworth with a 0.41 s hop.
  skip_warmup_frames: null


# ---------------------------------------------------------------------------
# Breathing detection (Fisher F-test fused with the phase ACF)
# ---------------------------------------------------------------------------
detection:
  # Doppler band where breathing is searched (Hz), RELATIVE to the carrier
  # (around 0 Hz).  0.1–0.8 Hz covers human breathing (6–48 breaths/min).
  # In cw_offset mode the code shifts this band by the TX offset for the
  # spectral test and keeps it in baseband for the ACF (which works on the
  # demodulated phase).
  breathing_band_hz: [0.1, 0.8]

  # Reference band used to estimate the noise floor (Hz), RELATIVE to the
  # carrier.  Must stay away from breathing and from the residual DC.
  reference_band_hz: [2.0, 5.0]

  # p-value threshold of the alert (Fisher test): 0.01 -> 1 % false alarms.
  # alert = True if p_value < false_alarm_probability.
  false_alarm_probability: 0.01

  # Weight of the Fisher score in the fusion (the ACF score weighs 1 - w).
  # 1 -> purely spectral decision; 0 -> purely autocorrelation; 0.5 -> balanced.
  spectral_weight: 0.5

  # --- Mapping of the raw indicators to scores in [0, 1] before fusion ---
  # Spectral score: log scale of the Fisher p-value.
  # p_value <= 10^(-p_value_decades) -> score 1; p_value = 1 -> score 0.
  p_value_decades: 3.0

  # Temporal score: linear ramp of the phase autocorrelation peak.
  # acf_peak <= acf_floor -> score 0; acf_peak >= acf_good -> score 1.
  acf_floor: 0.2
  acf_good: 0.7

  # Length (s) of the phase history used by the ACF, independent of n_fft.
  # It must cover SEVERAL breathing periods: the longest detectable period is
  # 1 / breathing_band_hz[0] (1 / 0.1 = 10 s), so 3–5x that value keeps the
  # edge effect from crushing the peak.  Longer -> longer start-up latency.
  # 20 s ~ 6 cycles at 0.3 Hz.
  acf_buffer_s: 20.0


# ---------------------------------------------------------------------------
# Dashboard (matplotlib)
# ---------------------------------------------------------------------------
display:
  # Length of the history of the presence-score curve (columns).
  score_history_length: 100

  # Visual threshold drawn on the score curve (dashed line); the status
  # turns to "breathing detected" above it.
  score_threshold: 0.6

  # Start the dashboard in full screen.
  full_screen: false


# ---------------------------------------------------------------------------
# Radar link budget (range shown on the dashboard)
# ---------------------------------------------------------------------------
link_budget:
  # ---- Optimistic scenario (free space, unobstructed target) ----
  optimistic:
    tx_power_dbm: -13             # PlutoSDR with tx_gain_db = -20 dB, about -13 dBm.
    tx_antenna_gain_dbi: 2        # Omnidirectional antenna ~2, patch 6–10.
    rx_antenna_gain_dbi: 2
    radar_cross_section_m2: 0.5   # Human chest, front view: about 0.5–1.0 m².
    noise_figure_db: 4            # AD9363: typically 3–5 dB.
    system_losses_db: 3           # Cables / connectors.
    min_snr_db: 3

  # ---- Pessimistic scenario (rubble, worst case in the field) ----
  pessimistic:
    tx_power_dbm: -13
    tx_antenna_gain_dbi: 0        # Badly oriented antennas.
    rx_antenna_gain_dbi: 0
    radar_cross_section_m2: 0.05  # Partially hidden target.
    noise_figure_db: 6
    system_losses_db: 25          # 3 dB cables + about 20 dB through rubble.
    min_snr_db: 3

  # Effective noise bandwidth (Hz).  In theory the bin width f_s_dec / n_fft
  # (0.24 Hz), but the phase noise of the Pluto oscillator raises the floor to
  # about 30–100 Hz in practice.
  noise_bandwidth_hz: 50


# ---------------------------------------------------------------------------
# Recorded sessions (scripts/record.py)
# ---------------------------------------------------------------------------
recording:
  # Folder of the HDF5 session files (relative to the repository root).
  sessions_dir: data/sessions

  # Maximum time between two writes to disk (s): at most this much signal is
  # lost if the program is killed during an acquisition.
  flush_interval_s: 1.0


# ---------------------------------------------------------------------------
# Simulation (no PlutoSDR needed)
# ---------------------------------------------------------------------------
simulation:
  # Use the simulated source (true) or the PlutoSDR (false).
  enabled: false

  # Person in front of the radar (false = empty scene); ignored when a
  # timeline is given.
  presence: true

  # Optional scene timeline [[t_start_s, state], ...] with the states
  # breathing, empty, motion (body sway) and apnea (heartbeat only), e.g.
  # [[0, breathing], [45, apnea], [60, breathing], [95, motion], [110, empty]]
  timeline: null

  # Breathing: frequency (Hz, 0.3 Hz = 18 breaths/min) and peak chest
  # displacement (mm).
  breath_rate_hz: 0.3
  breath_amplitude_mm: 10

  # Heartbeat: frequency (Hz) and peak chest displacement (mm).
  heart_rate_hz: 1.2
  heart_amplitude_mm: 0.15

  # Amplitude of the body sway during "motion" periods (mm).
  motion_amplitude_mm: 40.0

  # Distance of the person (m): only sets the phase of its echo.
  target_range_m: 3.0

  # Amplitudes in ADC units (the Pluto ADC delivers integers in [-2048, 2047]):
  # echo of the person, TX->RX leakage + static clutter (at the TX frequency,
  # like every echo) and receiver DC offset (at 0 Hz).
  target_amplitude: 1.0
  static_clutter_amplitude: 30.0
  receiver_dc_amplitude: 50.0

  # Residual TX/RX local-oscillator offset (Hz); ~0 on a Pluto.
  lo_offset_hz: 0.0

  # Ratio (echo of the person)^2 / noise power per ADC sample (dB), before the
  # processing gain of the decimation (+30 dB for D = 1000).
  snr_db: -25.0

  # Seed of the noise generator (null = different noise at each run).
  seed: null

  # Deliver the samples at the real sampling rate, like the hardware
  # (false = as fast as possible).
  realtime: true
