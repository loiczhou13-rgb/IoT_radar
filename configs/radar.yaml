# =============================================================================
# Radar configuration — CW radar detecting the breathing of buried people
# =============================================================================
# Units by key suffix: _hz, _s, _m / _mm, _db / _dbm / _dbi, _m2.
# Unknown keys are refused at start-up.


# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging:
  level: "INFO"     # DEBUG prints the metrics of every analysis window
  to_file: true     # also write logs/radar_<timestamp>.log (--log-file chooses another file)


# ---------------------------------------------------------------------------
# PlutoSDR transceiver (AD9363)
# ---------------------------------------------------------------------------
sdr:
  uri: "ip:192.168.2.1"         # network ("ip:192.168.2.1") or USB ("usb:")

  # 2.4 GHz ISM band; λ = 12.24 cm: dφ = 4π·D/λ, Doppler ≈ 16·v Hz.
  center_frequency_hz: 2.45e+9

  # Set by what the host reads in real time: at 2 MS/s over USB (WSL2) every
  # dashboard redraw lost samples; 1 MS/s was measured without loss.
  sample_rate_hz: 1.0e+6

  rx_gain_db: 45                # manual gain; aim at 50–80 % of the ADC full scale (±2048)
  tx_gain_db: -20               # TX attenuation (≤ 0); lower it if the leakage saturates the receiver

  buffer_size: 65536            # 65.5 ms at 1 MS/s; large buffers cut the per-buffer overhead
  rx_kernel_buffers: 16         # 1 s of margin for a dashboard redraw (the default 4 still loses samples)


# ---------------------------------------------------------------------------
# Transmitted signal
# ---------------------------------------------------------------------------
tx:
  # "cw": pure carrier; "cw_offset": tone at offset_hz, away from the receiver
  # DC and its 1/f noise.
  waveform: "cw_offset"

  # Snapped to a multiple of sample_rate_hz / buffer_size (15.26 Hz) so that
  # the cyclic buffer is continuous: 500 Hz -> 503.54 Hz.
  offset_hz: 500


# ---------------------------------------------------------------------------
# Slow time
# ---------------------------------------------------------------------------
slow_time:
  # sample_rate_hz / rate_hz: integer of primes <= 13; rate_hz > 2.5 x top of the reference band.
  rate_hz: 20.0
  warmup_s: 1.0                 # dropped after a (re)start while the filters settle


# ---------------------------------------------------------------------------
# Window analysis and breathing detection
# ---------------------------------------------------------------------------
vital_signs:
  window_s: 20.0                # analysis window: >= 2 periods of the slowest breath
  update_period_s: 0.5          # time between two analyses

  breathing_band_hz: [0.1, 0.5]   # 6–30 breaths/min
  reference_band_hz: [2.5, 5.0]   # noise-only band (without M1)

  # Circle fit (centre = DC offset), then arctangent.  Below this arc or above
  # this relative residual (noise cloud ≈ 0.4) the linear demodulation is used.
  min_arc_rad: 0.3
  max_circle_residual: 0.3

  # Remove a common phase ramp (TX/RX LO offset).  Off: the Pluto shares one
  # LO, and the ramp would also take a slow chest movement.
  lo_drift_compensation: false

  bandpass_order: 4             # Butterworth order of the breathing band-pass

  detection:
    snr_min_db: 8.0            # band SNR -> score 0 ...
    snr_good_db: 16.0          # ... -> score 1
    peak_halfwidth_hz: 0.1     # half-width of the peak window (concentration)
    concentration_floor: 0.55  # noise ≈ 0.5 -> score 0 ...
    concentration_good: 0.85   # ... clean breathing -> score 1
    motion_ptp_mm: 30.0        # peak-to-peak displacement above which a window is MOTION
    motion_window_s: 5.0       # recent segment also checked for motion
    motion_hold_s: 3.0         # MOTION held after the last corrupted window
    smoothing_tau_s: 4.0       # time constant of the confidence smoothing
    threshold_on: 0.6          # smoothed confidence entering BREATHING
    threshold_off: 0.4         # ... leaving it (hysteresis)
    rate_median_len: 5         # reported rate = median of the last N estimates
    apnea_s: 10.0              # no inhalation for this long -> apnea alert ...
    apnea_memory_s: 30.0       # ... if breathing was detected within this delay


# ---------------------------------------------------------------------------
# Robustness to the people moving around the radar
# ---------------------------------------------------------------------------
# Both methods off = former behaviour (any large movement pauses the measurement).
motion_robustness:
  doppler_rate_hz: 100.0        # rate of M1 and M3; Nyquist 50 Hz > walking Doppler (24.5 Hz at 1.5 m/s)

  doppler_filter:               # M1: linear-phase low-pass on the IQ, before the demodulation
    enabled: true
    cutoff_hz: 1.5              # -6 dB; flat up to 1 Hz (breathing harmonics)
    transition_hz: 1.0          # stop band from 2 Hz, below the gestures (>= 3 Hz)
    stopband_attenuation_db: 60.0   # 365 taps: 1.82 s of delay, 3.6 s of warm-up
    noise_band_hz: [0.1, 1.4]   # noise floor of the detector, inside the pass band (peak excluded)

  alias_check:                  # aliasing audit, logged at start-up
    band_hz: 1.0                # band of interest ±1 Hz
    min_attenuation_db: 60.0    # warning below this (M1: 84 dB)

  contamination_weighting:      # M3: weights, gap-tolerant estimation, pause rule
    enabled: true
    block_s: 1.0                # blocks of the contamination index
    out_of_band_start_hz: 2.0   # energy from here to doppler_rate_hz / 2 ...
    in_band_hz: [0.1, 1.0]      # ... against the energy in this band, per Hz
    weight_midpoint_db: 9.0     # weight 0.5 (noise: 0 dB); sweep: Pd 85 % against 72 % at 6 dB
    weight_slope_db: 2.0        # 0.99 at 0 dB, 0.05 at 15 dB
    contaminated_below: 0.5     # lower weight = contaminated sample
    activity_band_hz: [3.0, 28.0]       # human Doppler ...
    activity_reference_hz: [30.0, 38.0] # ... against the noise above it
    activity_threshold_db: 6.0  # someone moves around (noise 0 ± 3 dB; walker at 3-6 m +8 to +22 dB)
    activity_lead_s: 10.0       # in-band anomaly preceded by activity = passer-by's
    excursion_factor: 2.5       # cut excursions above 2.5 x the median local peak-to-peak ...
    excursion_floor_mm: 12.0    # ... and, away from any activity, above 12 mm
    min_segment_s: 5.0          # shorter segments between cuts get weight 0 (cannot hold a breath)
    pause_on_saturation: true   # pause while the ADC saturates


# ---------------------------------------------------------------------------
# Measurement mode (M4): one decision over a silence, started by the operator
# ---------------------------------------------------------------------------
measurement:
  duration_s: 30.0
  min_valid_fraction: 0.5       # minimum share of uncontaminated samples for a decision


# ---------------------------------------------------------------------------
# Micro-Doppler view (display only)
# ---------------------------------------------------------------------------
micro_doppler_view:
  window_s: 3.2          # one column (64 samples at 20 Hz)
  n_fft: 256             # zero-padded FFT size
  window: "hann"
  display_max_hz: 3.0    # span shown (±)


# ---------------------------------------------------------------------------
# Dashboard
# ---------------------------------------------------------------------------
display:
  history_s: 120.0          # length of the timelines
  waterfall_columns: 240    # micro-Doppler columns kept (2 min)
  full_screen: false


# ---------------------------------------------------------------------------
# Link budget (range shown on the dashboard)
# ---------------------------------------------------------------------------
link_budget:
  optimistic:                     # free space, unobstructed target
    tx_power_dbm: -13             # Pluto with tx_gain_db = -20 dB
    tx_antenna_gain_dbi: 2        # omnidirectional ~2, patch 6–10
    rx_antenna_gain_dbi: 2
    radar_cross_section_m2: 0.5   # human chest, front view: 0.5–1.0 m²
    noise_figure_db: 4            # AD9363: 3–5 dB
    system_losses_db: 3           # cables, connectors
    min_snr_db: 3

  pessimistic:                    # rubble, worst case
    tx_power_dbm: -13
    tx_antenna_gain_dbi: 0        # badly oriented antennas
    rx_antenna_gain_dbi: 0
    radar_cross_section_m2: 0.05  # partially hidden target
    noise_figure_db: 6
    system_losses_db: 25          # 3 dB cables + ~20 dB through rubble
    min_snr_db: 3

  # Empirical value of the former calibration (phase noise and clutter
  # residue), far above the theoretical 1 / window.
  noise_bandwidth_hz: 50


# ---------------------------------------------------------------------------
# Recorded sessions (scripts/record.py)
# ---------------------------------------------------------------------------
recording:
  sessions_dir: data/sessions   # relative to the repository root
  flush_interval_s: 1.0         # at most this much signal lost if the program is killed


# ---------------------------------------------------------------------------
# Simulation (no PlutoSDR needed)
# ---------------------------------------------------------------------------
simulation:
  enabled: false                # simulated source instead of the PlutoSDR
  presence: true                # person in front of the radar (ignored with a timeline)

  # Optional [[t_start_s, state], ...], states breathing, empty, motion (sway)
  # and apnea (heartbeat only), e.g. [[0, breathing], [45, apnea], [60, breathing]]
  timeline: null

  breath_rate_hz: 0.3           # 18 breaths/min
  breath_amplitude_mm: 10       # peak chest displacement
  heart_rate_hz: 1.2
  heart_amplitude_mm: 0.15
  motion_amplitude_mm: 40.0     # body sway during "motion"
  target_range_m: 3.0           # only sets the phase of the echo

  # Amplitudes in ADC units: echo, leakage + static clutter (at the TX
  # frequency, like every echo), receiver DC (at 0 Hz).
  target_amplitude: 1.0
  static_clutter_amplitude: 30.0
  receiver_dc_amplitude: 50.0

  lo_offset_hz: 0.0             # TX/RX LO offset; ~0 on a Pluto

  # Echo² / noise power per ADC sample (+47 dB of processing gain to the 20 Hz slow time).
  snr_db: -25.0

  seed: null                    # null = different noise at each run
  realtime: true                # deliver at the real rate (false = as fast as possible)

  # Walls, furniture: scene position (radar at the origin, boresight +y,
  # person at (0, target_range_m)) and amplitude (ADC units); masked by the
  # disturbers, which makes the centre of the arc drift.
  # Example: [{position_m: [-1.5, 5.0], amplitude: 20.0}]
  static_scatterers: []

  # People moving around (iot_radar/acquisition/disturbers.py):
  #   walker  — start_m, velocity_m_s (0.5–1.5 m/s), start_s, stop_s, amplitude_at_1m
  #   sway    — position_m, amplitude_m (0.03), frequency_hz (0.8), start_s, stop_s, amplitude_at_1m
  #   gesture — position_m, amplitude_m (0.08), frequency_hz (2.0), start_s, stop_s, amplitude_at_1m
  # amplitude_at_1m: torso echo at 1 m (default 12.7), decaying as 1/R².
  # Example: [{kind: walker, start_m: [-6.0, 3.0], velocity_m_s: [1.0, 0.0], start_s: 30.0}]
  disturbers: []
