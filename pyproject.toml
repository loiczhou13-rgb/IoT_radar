[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "iot-radar"
version = "0.1.0"
description = "Continuous-wave radar (ADALM-Pluto) for detecting the breathing of buried people"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pyyaml",
]

[project.optional-dependencies]
hardware = ["pyadi-iio", "pylibiio"]
ml = ["torch", "tqdm"]
ui = ["pygame"]
notebook = ["ipykernel"]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["iot_radar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
