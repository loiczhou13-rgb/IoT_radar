<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Formulaire clair</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #1c1c1c, #2c3e50);
      color: white;
    }

    /* HEADER */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 70px;
      background: rgba(30, 30, 30, 0.85);
      backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: bold;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.6);
      z-index: 1000;
    }

    main {
      padding-top: 100px;
      display: flex;
      justify-content: center;
      padding-bottom: 50px;
    }

    .container {
      width: 400px;
      padding: 25px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(8px);
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 15px;
      font-size: 14px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: none;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.15);
      color: white;
      outline: none;
      font-size: 14px;
    }

    textarea {
      height: 80px;
      resize: none;
    }

    /* Alignement propre pour radio et checkbox */
    .choices {
      margin-top: 15px;
    }

    .choices label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
    }

    .choices-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      color: white;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
      transition: 0.3s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
    }

    button:active {
      transform: translateY(1px);
    }

    footer {
      text-align: center;
      padding: 15px;
      background: rgba(30, 30, 30, 0.6);
      backdrop-filter: blur(4px);
      font-size: 14px;
      margin-top: 30px;
    }
  </style>
</head>

<body>
  <header>Mon Site Web</header>

  <main>
    <form class="container" autocomplete="off" novalidate>
      <h2>Inscription</h2>

      <label for="prenom">Prénom</label>
      <input id="prenom" name="prenom" type="text" placeholder="Votre prénom" required autocomplete="off" />

      <label for="nom">Nom</label>
      <input id="nom" name="nom" type="text" placeholder="Votre nom" required autocomplete="off" />

      <label for="email">Email</label>
      <input
        id="email"
        name="email"
        type="email"
        placeholder="email@mail.com"
        required
        autocomplete="off"
      />

      <label for="password">Mot de passe</label>
      <input
        id="password"
        name="password"
        type="password"
        placeholder="••••••"
        required
        autocomplete="new-password"
      />

      <label for="tel">Téléphone</label>
      <input id="tel" name="tel" type="tel" placeholder="06 12 34 56 78" autocomplete="off" />

      <label for="dob">Date de naissance</label>
      <input id="dob" name="dob" type="date" autocomplete="off" />

      <label for="pays">Pays</label>
      <select id="pays" name="pays" required>
        <option value="">-- Choisir --</option>
        <option>France</option>
        <option>Belgique</option>
        <option>Suisse</option>
      </select>

      <label for="metier">Métier</label>
      <select id="metier" name="metier" required>
        <option value="">-- Choisir --</option>
        <option>Développeur</option>
        <option>Designer</option>
        <option>Étudiant</option>
        <option>Autre</option>
      </select>

      <div class="choices">
        <span>Genre :</span>
        <div class="choices-group">
          <label><input type="radio" name="genre" value="homme" checked /> Homme</label>
          <label><input type="radio" name="genre" value="femme" /> Femme</label>
        </div>
      </div>

      <div class="choices">
        <div class="choices-group">
          <label><input type="checkbox" name="conditions" checked required /> J'accepte les conditions</label>
          <label><input type="checkbox" name="newsletter" /> Recevoir la newsletter</label>
        </div>
      </div>

      <label for="message">Message</label>
      <textarea id="message" name="message" placeholder="Votre message..."></textarea>

      <button type="submit">Envoyer</button>
    </form>
  </main>

  <footer>© 2026 Mon Site Web</footer>
</body>
</html>
